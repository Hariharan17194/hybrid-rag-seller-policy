# ALTERNATIVE: use this only on a server WITHOUT Traefik (ports 80 and 443 must be free).
# Caddy is a small web server that gets the HTTPS certificate automatically.
#
#   docker compose -f docker-compose.caddy.yml up -d --build

services:
  sellerpolicy:
    build:
      context: .
      args:
        EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
    image: sellerpolicy-assistant:latest
    container_name: sellerpolicy
    restart: unless-stopped
    env_file: .env
    expose:
      - "8501"

  caddy:
    image: caddy:2
    container_name: sellerpolicy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sellerpolicy

volumes:
  caddy_data:
  caddy_config:
