name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The test suite is fully offline (hashing embedder), so torch / sentence-transformers are not needed.
      - run: pip install pydantic-settings python-dotenv pypdf numpy bm25s chromadb openai fastapi httpx pytest
      - run: pytest -q
